name: souvenal-top-dev

services:
  web:
    image: nginx:alpine
    ports:
      # 开发环境只允许本机访问，不启动 Cloudflare Tunnel。
      - "127.0.0.1:18080:80"
    volumes:
      # 直接挂载源码；修改静态文件后刷新浏览器即可。
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
