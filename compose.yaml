name: souvenal-top

services:
  web:
    build:
      context: .
    image: souvenal-web:local
    restart: unless-stopped
    # 生产环境不发布本机端口，只允许 cloudflared 通过内部网络访问。
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - site

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # 当前代理网络下 QUIC/UDP 7844 超时，改用 TCP 7844。
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      web:
        condition: service_healthy
    networks:
      - site

networks:
  site:
    driver: bridge
